services:
  api:
    build:
      context: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/cimax
      PSW: local-delete-password
      ADMIN_API_KEY: local-admin-key
      OPERATOR_API_KEY: local-operator-key
      VIEWER_API_KEY: local-viewer-key
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 120
      IDEMPOTENCY_TTL_MS: 86400000
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: "true"
      CORS_ORIGIN: http://localhost:3000,https://cimax.postigo.sh
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
    command: npm run worker
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      QUEUE_ENABLED: "true"
      MONGO_URI: mongodb://mongo:27017/cimax
    depends_on:
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
